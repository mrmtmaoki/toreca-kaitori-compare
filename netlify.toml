[build]
  base = "web"
  # Netlify's included_files can't escape the base directory (confirmed via
  # live deploy: "../data/kaitori.db" silently bundled nothing, every
  # function saw "unable to open database file" no matter which candidate
  # path web/lib/db.ts tried), so the DB is copied inside `web/` first.
  command = "mkdir -p ./data && cp ../data/kaitori.db ./data/kaitori.db && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Bundled into the deployed serverless function so the read-only node:sqlite
# connection in web/lib/db.ts can open it at runtime.
[functions]
  included_files = ["data/kaitori.db"]

# On Netlify, next/image is served through Netlify's own Image CDN, not
# Next.js's built-in optimizer — next.config.ts's images.remotePatterns
# alone isn't enough (confirmed live: every card thumbnail 403'd from
# /_next/image despite the hostname being in remotePatterns). Netlify
# Image CDN needs its own separate allowlist here, one regex per source
# host card images actually come from (web/next.config.ts's remotePatterns
# list is the source of truth for which hosts these should match).
# Netlify parses each pattern as a JS regex literal, so literal "/" needs
# escaping too, not just ".": first fix attempt only escaped dots and still
# 403'd live even after deploying — per Netlify's own docs the "/" in
# "https://" and in the trailing "/.*" must be "\/" (written "\\/" in TOML).
[images]
  remote_images = [
    "https:\\/\\/www\\.suruga-ya\\.jp\\/.*",
    "https:\\/\\/makeshop-multi-images\\.akamaized\\.net\\/.*",
    "https:\\/\\/otachu-akiba\\.com\\/.*",
    "https:\\/\\/www\\.mercardop\\.jp\\/.*"
  ]
