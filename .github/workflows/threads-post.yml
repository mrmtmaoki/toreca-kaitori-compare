name: Threads trend post

on:
  # Schedule paused 2026-08-03: since the 2026-07-30 self-healing fix, only
  # ~1 of the 4 daily slots has actually been posting successfully per day
  # (confirmed via Actions run history — the rest fail with a generic
  # "Process completed with exit code 1", real reason not yet confirmed from
  # the job log; a Threads API per-day posting cap on this account/app is
  # the leading guess, since one success followed by same-day failures
  # doesn't fit an expired/invalid token, which would fail every attempt).
  # Every real post also triggers a state-file commit, which (via Netlify's
  # git-triggered auto-deploy) triggers a full site rebuild — paying for
  # rebuilds on a feature that's mostly failing isn't worth it. Restore the
  # `schedule:` block above once the actual cause is confirmed and fixed;
  # `workflow_dispatch` below still allows a manual one-off run meanwhile.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      - run: npm run post:threads-trend
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}

      - name: Commit updated post state
        run: |
          # Most polls between slots post nothing, so the state file often
          # doesn't change (or, before the day's first post, doesn't exist
          # yet) — nothing to commit is the common case here, not an error.
          if [ ! -f data/threads-post-state.json ]; then
            echo "no state file yet (nothing posted this run), skipping commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/threads-post-state.json
          git diff --staged --quiet || git commit -m "chore: threads post state $(date -u +%Y-%m-%dT%H-%M-%SZ)"
          # Same retry-on-push-conflict shape as scrape.yml, since polling
          # every 30 min makes a landed-in-between commit on main more
          # likely than this workflow saw before.
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $i), retrying after rebase"
            git fetch origin main
            git rebase origin/main
          done
          git push
