name: Daily scrape

on:
  schedule:
    # 20:05 UTC = 05:05 JST (off the exact hour to avoid GitHub's top-of-hour scheduling congestion)
    - cron: "5 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      - run: npm run typecheck

      - run: npm run scrape

      - name: Commit updated price data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kaitori.db
          git diff --staged --quiet || git commit -m "chore: daily price scrape $(date -u +%Y-%m-%d)"
          # push can be rejected if another workflow (or a manual push) landed
          # a commit on main since checkout — retry with a merge that prefers
          # this run's freshly-scraped data/kaitori.db over whatever the
          # remote side changed in that same binary file (confirmed cause of
          # a real missed run 2026-07-27: this step failed after a manual
          # push collided with the scheduled run).
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $i), retrying after merge"
            git fetch origin main
            git merge -X ours origin/main --no-edit
          done
          git push
