name: Daily scrape

on:
  schedule:
    # 20:05 UTC = 05:05 JST (off the exact hour to avoid GitHub's top-of-hour scheduling congestion)
    - cron: "5 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      - run: npm run typecheck

      - run: npm run scrape

      - name: Commit updated price data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kaitori.db
          git diff --staged --quiet || git commit -m "chore: daily price scrape $(date -u +%Y-%m-%d)"
          git push
